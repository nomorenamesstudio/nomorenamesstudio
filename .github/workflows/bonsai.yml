name: Git Bonsai

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/bonsai.yml]

permissions:
  contents: write

concurrency: bonsai

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: appnice/git-bonsai@v0.2.1
